ont-size="16" fill="#ff713f" text-anchor="middle" >04</text><circle cx="1459.0579710144928" cy="1028.695652173913" r="19" fill="#0b131a" stroke="#ff713f" stroke-width="2"/><text x="1459.0579710144928" y="1034.695652173913" font-size="16" fill="#ff713f" text-anchor="middle" >05</text><circle cx="1990.5797101449275" cy="1005.072463768116" r="19" fill="#0b131a" stroke="#ff713f" stroke-width="2"/><text x="1990.5797101449275" y="1011.072463768116" font-size="16" fill="#ff713f" text-anchor="middle" >06</text><path d="M691.304347826087,1190 L2108.695652173913,1190" fill="none" stroke="#78868c" stroke-width="1.3" vector-effect="non-scaling-stroke" stroke-dasharray=""/><path d="M691.304347826087,1182 L691.304347826087,1198" fill="none" stroke="#78868c" stroke-width="2" vector-effect="non-scaling-stroke" stroke-dasharray=""/><path d="M2108.695652173913,1182 L2108.695652173913,1198" fill="none" stroke="#78868c" stroke-width="2" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="1400.0" y="1175" font-size="23" fill="#e0e6e7" text-anchor="middle" >120 m</text><text x="2730" y="1242" font-size="17" fill="#78868c" text-anchor="end" >正投影设计示意 · 设备细节非制造尺寸 · 编号对应下方结构点</text><text x="75" y="1292" font-size="23" fill="#ff713f" text-anchor="start" >01</text><text x="122" y="1292" font-size="23" fill="#e0e6e7" text-anchor="start" >冰内嵌入舱</text><text x="975" y="1292" font-size="23" fill="#ff713f" text-anchor="start" >02</text><text x="1022" y="1292" font-size="23" fill="#e0e6e7" text-anchor="start" >双叶不规则冰体</text><text x="1875" y="1292" font-size="23" fill="#ff713f" text-anchor="start" >03</text><text x="1922" y="1292" font-size="23" fill="#e0e6e7" text-anchor="start" >裂隙与热应力</text><text x="75" y="1343" font-size="23" fill="#ff713f" text-anchor="start" >04</text><text x="122" y="1343" font-size="23" fill="#e0e6e7" text-anchor="start" >六道鞍座约束</text><text x="975" y="1343" font-size="23" fill="#ff713f" text-anchor="start" >05</text><text x="1022" y="1343" font-size="23" fill="#e0e6e7" text-anchor="start" >两根纵向承梁</text><text x="1875" y="1343" font-size="23" fill="#ff713f" text-anchor="start" >06</text><text x="1922" y="1343" font-size="23" fill="#e0e6e7" text-anchor="start" >融水回收与尾拖机</text><path d="M65,1384 L2735,1384" fill="none" stroke="#78868c" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="75" y="1440" font-size="26" fill="#ff713f" text-anchor="start" >风险 / 读数决定拆法</text><text x="75" y="1492" font-size="22" fill="#e0e6e7" text-anchor="start" >热切会融化承力附近冰体并扩展裂隙。</text><text x="75" y="1540" font-size="22" fill="#e0e6e7" text-anchor="start" >居住舱嵌在冰中，不是整块冰体有压。</text><text x="75" y="1588" font-size="22" fill="#e0e6e7" text-anchor="start" >六道约束与两条纵梁需要保留到回水完成。</text><path d="M950,1420 L950,1694" fill="none" stroke="#35444c" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="975" y="1440" font-size="26" fill="#ff713f" text-anchor="start" >拆解 / 安全顺序</text><text x="975" y="1492" font-size="22" fill="#e0e6e7" text-anchor="start" >扫描裂隙 → 保住舱区与鞍座支撑</text><text x="975" y="1540" font-size="22" fill="#e0e6e7" text-anchor="start" >分区控温融水 → 管路回收水资源</text><text x="975" y="1588" font-size="22" fill="#e0e6e7" text-anchor="start" >拆嵌入舱 → 六道约束 → 纵梁与尾机</text><path d="M1850,1420 L1850,1694" fill="none" stroke="#35444c" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="1875" y="1440" font-size="26" fill="#ff713f" text-anchor="start" >回报 / 目标节奏</text><text x="1875" y="1492" font-size="22" fill="#e0e6e7" text-anchor="start" >200 m 船坞 · 目标 40 分钟</text><text x="1875" y="1540" font-size="22" fill="#e0e6e7" text-anchor="start" >约 $210,000 + 水资源收入</text><text x="1875" y="1588" font-size="22" fill="#e0e6e7" text-anchor="start" >约 9,000 t 冰体为平衡草案，待实测</text><path d="M65,1708 L2735,1708" fill="none" stroke="#78868c" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="75" y="1755" font-size="20" fill="#78868c" text-anchor="start" >设计审阅稿 · 未接入游戏 · 金额与耗时是平衡目标</text><text x="2730" y="1755" font-size="18" fill="#ff713f" text-anchor="end" >EXTERIOR / ORIGINAL GEOMETRY</text></svg>