</style><rect width="2800" height="1800" fill="#07151e"/><text x="75" y="95" font-size="24" fill="#ff713f" text-anchor="start" >PT-34 / TEARDOWN SEQUENCE</text><text x="75" y="169" font-size="54" fill="#e0e6e7" text-anchor="start" >隼鹰 · 从入口到整舰拆解</text><text x="75" y="225" font-size="25" fill="#78868c" text-anchor="start" >每一阶段都有可确认的读数与状态，避免玩家只是在厚装甲上长时间磨切。</text><rect x="75" y="315" width="865" height="360" rx="0" fill="#10232e" stroke="#315363" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="105" y="381" font-size="42" fill="#ff713f" text-anchor="start" >01</text><text x="186" y="381" font-size="34" fill="#e0e6e7" text-anchor="start" >找到入口</text><text x="105" y="466" font-size="25" fill="#e0e6e7" text-anchor="start" >尾部检修口与传感标记</text><text x="105" y="526" font-size="23" fill="#80dbe4" text-anchor="start" >解锁：远程扫描 / 维护路线图</text><path d="M105,575 L905,575" fill="none" stroke="#315363" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="105" y="628" font-size="20" fill="#78868c" text-anchor="start" >上一步完成后才展开本段操作</text><rect x="980" y="315" width="865" height="360" rx="0" fill="#10232e" stroke="#315363" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="1010" y="381" font-size="42" fill="#ff713f" text-anchor="start" >02</text><text x="1091" y="381" font-size="34" fill="#e0e6e7" text-anchor="start" >逐段卸压</text><text x="1010" y="466" font-size="25" fill="#e0e6e7" text-anchor="start" >生活区、三层甲板、独立弹库</text><text x="1010" y="526" font-size="23" fill="#80dbe4" text-anchor="start" >确认：每个压力区单独归零</text><path d="M1010,575 L1810,575" fill="none" stroke="#315363" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="1010" y="628" font-size="20" fill="#78868c" text-anchor="start" >上一步完成后才展开本段操作</text><rect x="1885" y="315" width="865" height="360" rx="0" fill="#10232e" stroke="#315363" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="1915" y="381" font-size="42" fill="#ff713f" text-anchor="start" >03</text><text x="1996" y="381" font-size="34" fill="#e0e6e7" text-anchor="start" >隔离电网</text><text x="1915" y="466" font-size="25" fill="#e0e6e7" text-anchor="start" >A 网、B 网、武器局部储能</text><text x="1915" y="526" font-size="23" fill="#80dbe4" text-anchor="start" >确认：三类电读数分别归零</text><path d="M1915,575 L2715,575" fill="none" stroke="#315363" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="1915" y="628" font-size="20" fill="#78868c" text-anchor="start" >上一步完成后才展开本段操作</text><rect x="75" y="755" width="865" height="360" rx="0" fill="#10232e" stroke="#315363" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="105" y="821" font-size="42" fill="#ff713f" text-anchor="start" >04</text><text x="186" y="821" font-size="34" fill="#e0e6e7" text-anchor="start" >危险品转运</text><text x="105" y="906" font-size="25" fill="#e0e6e7" text-anchor="start" >弹库 39 发 / 5 格垂发 / 其他备弹</text><text x="105" y="966" font-size="23" fill="#80dbe4" text-anchor="start" >目标：整件转移，不计作废金属</text><path d="M105,1015 L905,1015" fill="none" stroke="#315363" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="105" y="1068" font-size="20" fill="#78868c" text-anchor="start" >上一步完成后才展开本段操作</text><rect x="980" y="755" width="865" height="360" rx="0" fill="#10232e" stroke="#315363" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="1010" y="821" font-size="42" fill="#ff713f" text-anchor="start" >05</text><text x="1091" y="821" font-size="34" fill="#e0e6e7" text-anchor="start" >从内侧卸甲</text><text x="1010" y="906" font-size="25" fill="#e0e6e7" text-anchor="start" >维护通道卸螺栓 → 分块剥甲</text><text x="1010" y="966" font-size="23" fill="#80dbe4" text-anchor="start" >回收：火控、计算机与精密设备</text><path d="M1010,1015 L1810,1015" fill="none" stroke="#315363" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="1010" y="1068" font-size="20" fill="#78868c" text-anchor="start" >上一步完成后才展开本段操作</text><rect x="1885" y="755" width="865" height="360" rx="0" fill="#10232e" stroke="#315363" stroke-width="1.4" vector-effect="non-scaling-stroke"/><text x="1915" y="821" font-size="42" fill="#ff713f" text-anchor="start" >06</text><text x="1996" y="821" font-size="34" fill="#e0e6e7" text-anchor="start" >拆动力与骨架</text><text x="1915" y="906" font-size="25" fill="#e0e6e7" text-anchor="start" >屏蔽动力段 → 推进剂 → 双主机</text><text x="1915" y="966" font-size="23" fill="#80dbe4" text-anchor="start" >收尾：吊运重件、分类交付、结算</text><path d="M1915,1015 L2715,1015" fill="none" stroke="#315363" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="1915" y="1068" font-size="20" fill="#78868c" text-anchor="start" >上一步完成后才展开本段操作</text><text x="75" y="1280" font-size="34" fill="#ff713f" text-anchor="start" >进入合同市场的成长门槛</text><text x="80" y="1355" font-size="29" fill="#e0e6e7" text-anchor="start" >200 m 船坞 + 足够牵引能力 + 远程测量 + 武器储能识别 + 精密拆卸工具。</text><text x="80" y="1420" font-size="27" fill="#e0e6e7" text-anchor="start" >第一单允许跨工作日保存；不会强迫玩家一次拆完。高价值完整件用于驱动工具升级。</text><text x="75" y="1530" font-size="32" fill="#80dbe4" text-anchor="start" >规划边界</text><text x="80" y="1590" font-size="25" fill="#e0e6e7" text-anchor="start" >保留现有 PT-34 / 134 m 数据标识；“超级巡洋舰”是本轮强化方向，待审后再确定正式分类。</text><text x="80" y="1645" font-size="25" fill="#78868c" text-anchor="start" >不在这份图包中声称已实现双电网、弹药转运、三层寻路或约 300 个可拆部件。</text><text x="75" y="1755" font-size="22" fill="#78868c" text-anchor="start" >R1 / 待审 · 价值 $650,000、80–100 分钟、约 300 件为设计目标，需入游戏后验证。</text></svg></body></html>
