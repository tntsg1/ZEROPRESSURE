ize="16" fill="#ff713f" text-anchor="middle" >03</text><circle cx="2534.627659574468" cy="782.1808510638298" r="19" fill="#0b131a" stroke="#ff713f" stroke-width="2"/><text x="2534.627659574468" y="788.1808510638298" font-size="16" fill="#ff713f" text-anchor="middle" >04</text><circle cx="238.031914893617" cy="495.1063829787234" r="19" fill="#0b131a" stroke="#ff713f" stroke-width="2"/><text x="238.031914893617" y="501.1063829787234" font-size="16" fill="#ff713f" text-anchor="middle" >05</text><circle cx="279.04255319148933" cy="959.8936170212766" r="19" fill="#0b131a" stroke="#ff713f" stroke-width="2"/><text x="279.04255319148933" y="965.8936170212766" font-size="16" fill="#ff713f" text-anchor="middle" >06</text><path d="M169.68085106382978,1190 L2630.31914893617,1190" fill="none" stroke="#78868c" stroke-width="1.3" vector-effect="non-scaling-stroke" stroke-dasharray=""/><path d="M169.68085106382978,1182 L169.68085106382978,1198" fill="none" stroke="#78868c" stroke-width="2" vector-effect="non-scaling-stroke" stroke-dasharray=""/><path d="M2630.31914893617,1182 L2630.31914893617,1198" fill="none" stroke="#78868c" stroke-width="2" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="1400.0" y="1175" font-size="23" fill="#e0e6e7" text-anchor="middle" >180 m</text><text x="2730" y="1242" font-size="17" fill="#78868c" text-anchor="end" >正投影设计示意 · 设备细节非制造尺寸 · 编号对应下方结构点</text><text x="75" y="1292" font-size="23" fill="#ff713f" text-anchor="start" >01</text><text x="122" y="1292" font-size="23" fill="#e0e6e7" text-anchor="start" >有压居住端舱</text><text x="975" y="1292" font-size="23" fill="#ff713f" text-anchor="start" >02</text><text x="1022" y="1292" font-size="23" fill="#e0e6e7" text-anchor="start" >偏置卷盘与制动</text><text x="1875" y="1292" font-size="23" fill="#ff713f" text-anchor="start" >03</text><text x="1922" y="1292" font-size="23" fill="#e0e6e7" text-anchor="start" >148 m 双绳跨度</text><text x="75" y="1343" font-size="23" fill="#ff713f" text-anchor="start" >04</text><text x="122" y="1343" font-size="23" fill="#e0e6e7" text-anchor="start" >配重与设备端舱</text><text x="975" y="1343" font-size="23" fill="#ff713f" text-anchor="start" >05</text><text x="1022" y="1343" font-size="23" fill="#e0e6e7" text-anchor="start" >姿控支架</text><text x="1875" y="1343" font-size="23" fill="#ff713f" text-anchor="start" >06</text><text x="1922" y="1343" font-size="23" fill="#e0e6e7" text-anchor="start" >先减旋再松缆</text><path d="M65,1384 L2735,1384" fill="none" stroke="#78868c" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="75" y="1440" font-size="26" fill="#ff713f" text-anchor="start" >风险 / 读数决定拆法</text><text x="75" y="1492" font-size="22" fill="#e0e6e7" text-anchor="start" >两端有角动量，剪断绳子不会自动停转。</text><text x="75" y="1540" font-size="22" fill="#e0e6e7" text-anchor="start" >148 m 为两锚点跨度；实际绳长含弧垂。</text><text x="75" y="1588" font-size="22" fill="#e0e6e7" text-anchor="start" >卷盘偏在一侧，松缆速度需要受控。</text><path d="M950,1420 L950,1694" fill="none" stroke="#35444c" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="975" y="1440" font-size="26" fill="#ff713f" text-anchor="start" >拆解 / 安全顺序</text><text x="975" y="1492" font-size="22" fill="#e0e6e7" text-anchor="start" >姿控减旋 → 同时读取两端速度</text><text x="975" y="1540" font-size="22" fill="#e0e6e7" text-anchor="start" >固定两端 → 制动卷盘 → 逐段松缆</text><text x="975" y="1588" font-size="22" fill="#e0e6e7" text-anchor="start" >打包双绳 → 两端舱分别卸压回收</text><path d="M1850,1420 L1850,1694" fill="none" stroke="#35444c" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="1875" y="1440" font-size="26" fill="#ff713f" text-anchor="start" >回报 / 目标节奏</text><text x="1875" y="1492" font-size="22" fill="#e0e6e7" text-anchor="start" >200 m 船坞 · 目标 35 分钟</text><text x="1875" y="1540" font-size="22" fill="#e0e6e7" text-anchor="start" >约 $260,000 · 完整卷盘与缆绳更值钱</text><text x="1875" y="1588" font-size="22" fill="#e0e6e7" text-anchor="start" >16 m 端舱 + 148 m 跨度 + 16 m 端舱</text><path d="M65,1708 L2735,1708" fill="none" stroke="#78868c" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray=""/><text x="75" y="1755" font-size="20" fill="#78868c" text-anchor="start" >设计审阅稿 · 未接入游戏 · 金额与耗时是平衡目标</text><text x="2730" y="1755" font-size="18" fill="#ff713f" text-anchor="end" >EXTERIOR / ORIGINAL GEOMETRY</text></svg>