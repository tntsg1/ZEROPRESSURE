<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2270" viewBox="0 0 3200 2270"><style>@font-face{font-family:ShipReview;src:url('file:///C:/Windows/Fonts/NotoSansSC-VF.ttf')}text{font-family:ShipReview,'Microsoft YaHei',sans-serif;font-weight:400}</style><rect width="3200" height="2270" fill="#0b1b25"/><text x="90" y="86" font-size="25" fill="#ff7849" text-anchor="start">CONTRACT / PROGRESSION</text><text x="90" y="163" font-size="57" fill="#e6e8e5" text-anchor="start">每艘船都有不同的拆解决定</text><text x="90" y="220" font-size="25" fill="#8c989d" text-anchor="start">先用已有操作形成完整合同，再按船引入新机制。工具升级增加可接合同与完整回收收益。</text><text x="90" y="309" font-size="29" fill="#92cdd8" text-anchor="start">船型</text><text x="445" y="309" font-size="29" fill="#92cdd8" text-anchor="start">要解决的问题</text><text x="1740" y="309" font-size="29" fill="#92cdd8" text-anchor="start">最先做的操作</text><text x="2450" y="309" font-size="29" fill="#92cdd8" text-anchor="start">成长工具</text><path d="M90,339 H3110" stroke="#37505c" stroke-width="1"/><text x="95" y="386" font-size="31" fill="#e6e8e5" text-anchor="start">01  斑鸠</text><text x="95" y="434" font-size="23" fill="#8c989d" text-anchor="start">JD-38</text><text x="445" y="385" font-size="24" fill="#e6e8e5" text-anchor="start">货物滑轨穿过两道门锁，先解除锁轨才能无损拖出。</text><text x="1740" y="385" font-size="24" fill="#e6e8e5" text-anchor="start">分别卸压 → 隔离动力电池</text><text x="2450" y="385" font-size="24" fill="#92cdd8" text-anchor="start">读压 / 基础扳手 / 精密切割</text><path d="M90,508 H3110" stroke="#37505c" stroke-width="1"/><text x="95" y="555" font-size="31" fill="#e6e8e5" text-anchor="start">02  磐石</text><text x="95" y="603" font-size="23" fill="#8c989d" text-anchor="start">TW-64</text><text x="445" y="554" font-size="24" fill="#e6e8e5" text-anchor="start">前锁喉、卷扬和机械臂各有机械锁与残余液压，需要按受力顺序释放。</text><text x="1740" y="554" font-size="24" fill="#e6e8e5" text-anchor="start">支撑船体 → 卸锁喉张力</text><text x="2450" y="554" font-size="24" fill="#92cdd8" text-anchor="start">受力读数 / 液压隔离 / 稳定抓钩</text><path d="M90,677 H3110" stroke="#37505c" stroke-width="1"/><text x="95" y="724" font-size="31" fill="#e6e8e5" text-anchor="start">03  栖湾</text><text x="95" y="772" font-size="23" fill="#8c989d" text-anchor="start">HB-86</text><text x="445" y="723" font-size="24" fill="#e6e8e5" text-anchor="start">培育舱的富氧空气与营养液要先分区回收，再打开玻璃与遮光闸。</text><text x="1740" y="723" font-size="24" fill="#e6e8e5" text-anchor="start">测气体组分 → 分段卸压</text><text x="2450" y="723" font-size="24" fill="#92cdd8" text-anchor="start">气体组分 / 多路泵 / 低热切割</text><path d="M90,846 H3110" stroke="#37505c" stroke-width="1"/><text x="95" y="893" font-size="31" fill="#e6e8e5" text-anchor="start">04  霜仓</text><text x="95" y="941" font-size="23" fill="#8c989d" text-anchor="start">CL-104</text><text x="445" y="892" font-size="24" fill="#e6e8e5" text-anchor="start">三个冷舱需要先维持温度再转移货物，断掉总制冷不是开工第一步。</text><text x="1740" y="892" font-size="24" fill="#e6e8e5" text-anchor="start">接临时供冷 → 逐段检压</text><text x="2450" y="892" font-size="24" fill="#92cdd8" text-anchor="start">温度扫描 / 临时供冷 / 冷媒回收</text><path d="M90,1015 H3110" stroke="#37505c" stroke-width="1"/><text x="95" y="1062" font-size="31" fill="#e6e8e5" text-anchor="start">05  铁誓</text><text x="95" y="1110" font-size="23" fill="#8c989d" text-anchor="start">ES-112</text><text x="445" y="1061" font-size="24" fill="#e6e8e5" text-anchor="start">保险库门有两路电锁与机械锁；先通检修路径，再整舱转移保管物。</text><text x="1740" y="1061" font-size="24" fill="#e6e8e5" text-anchor="start">进入检修柜 → 确认双路门锁状态</text><text x="2450" y="1061" font-size="24" fill="#92cdd8" text-anchor="start">双路电测 / 机械解锁 / 厚板拆卸</text><path d="M90,1184 H3110" stroke="#37505c" stroke-width="1"/><text x="95" y="1231" font-size="31" fill="#e6e8e5" text-anchor="start">06  潮汐</text><text x="95" y="1279" font-size="23" fill="#8c989d" text-anchor="start">FL-116</text><text x="445" y="1230" font-size="24" fill="#e6e8e5" text-anchor="start">管路看起来连成一体，但三种介质需要分路确认、隔离和回收。</text><text x="1740" y="1230" font-size="24" fill="#e6e8e5" text-anchor="start">扫描介质 → 建立三路隔离</text><text x="2450" y="1230" font-size="24" fill="#92cdd8" text-anchor="start">介质识别 / 多路隔离 / 高效泵</text><path d="M90,1353 H3110" stroke="#37505c" stroke-width="1"/><text x="95" y="1400" font-size="31" fill="#e6e8e5" text-anchor="start">07  望楼</text><text x="95" y="1448" font-size="23" fill="#8c989d" text-anchor="start">SV-122</text><text x="445" y="1399" font-size="24" fill="#e6e8e5" text-anchor="start">仪器吊架依靠船体共同减振，先拆大梁会让精密设备跌落或碰撞。</text><text x="1740" y="1399" font-size="24" fill="#e6e8e5" text-anchor="start">固定观测塔 → 隔离独立电源</text><text x="2450" y="1399" font-size="24" fill="#92cdd8" text-anchor="start">重心读数 / 精密拆卸 / 稳定抓钩</text><path d="M90,1522 H3110" stroke="#37505c" stroke-width="1"/><text x="95" y="1569" font-size="31" fill="#e6e8e5" text-anchor="start">08  熔脊</text><text x="95" y="1617" font-size="23" fill="#8c989d" text-anchor="start">MF-126</text><text x="445" y="1568" font-size="24" fill="#e6e8e5" text-anchor="start">停机不等于冷却完成，必须保持换热通路，先处理输送线再取炉芯。</text><text x="1740" y="1568" font-size="24" fill="#e6e8e5" text-anchor="start">停止输送 → 确认锁止与余热</text><text x="2450" y="1568" font-size="24" fill="#92cdd8" text-anchor="start">余热扫描 / 临时换热 / 重载吊运</text><path d="M90,1691 H3110" stroke="#37505c" stroke-width="1"/><text x="95" y="1738" font-size="31" fill="#e6e8e5" text-anchor="start">09  长桥</text><text x="95" y="1786" font-size="23" fill="#8c989d" text-anchor="start">RO-128</text><text x="445" y="1737" font-size="24" fill="#e6e8e5" text-anchor="start">大货物由四组独立锁轨固定，不能先切下承力甲板或随意打开前门。</text><text x="1740" y="1737" font-size="24" fill="#e6e8e5" text-anchor="start">支撑大货物 → 解除四组锁轨</text><text x="2450" y="1737" font-size="24" fill="#92cdd8" text-anchor="start">货物固定 / 液压卸载 / 长距牵引</text><path d="M90,1860 H3110" stroke="#37505c" stroke-width="1"/><text x="95" y="1907" font-size="31" fill="#e6e8e5" text-anchor="start">10  行舟</text><text x="95" y="1955" font-size="23" fill="#8c989d" text-anchor="start">CV-138</text><text x="445" y="1906" font-size="24" fill="#e6e8e5" text-anchor="start">主电池、吊架与每架无人机分别带电；保住完整机体比熔成废料更值钱。</text><text x="1740" y="1906" font-size="24" fill="#e6e8e5" text-anchor="start">分区卸压 → 隔离各机充电位</text><text x="2450" y="1906" font-size="24" fill="#92cdd8" text-anchor="start">多目标电测 / 整机吊运 / 高级拆卸</text><text x="90" y="2115" font-size="24" fill="#8c989d" text-anchor="start">实施边界：以上为设计规则。温控、临时供冷、液压蓄压、减振锁等需要单船原型验证，不能当作现有游戏已具备。</text><text x="90" y="2180" font-size="24" fill="#e6e8e5" text-anchor="start">基础先行：斑鸠 → 磐石；中段按工具分支开放；最后由隼鹰组合考核压力、电力、内部路径与重件回收。</text></svg>